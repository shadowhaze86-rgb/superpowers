# XcodeGen spec — erzeugt GTA6Companion.xcodeproj
#   brew install xcodegen && xcodegen generate
#
# Vor dem ersten Start: "com.example" (Bundle-IDs + App-Group) durch eine eigene Kennung ersetzen,
# auch in Shared/SharedData.swift (AppGroup.id).
name: GTA6Companion
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GTA6Companion:
    type: application
    platform: iOS
    sources:
      - path: GTA6Companion
      - path: Shared
    dependencies:
      - target: LeonidaWidgets
        embed: true
    entitlements:
      path: GTA6Companion/LeonidaGuide.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.leonidaguide
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.leonidaguide
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Leonida Guide"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  LeonidaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Leonida Guide"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/LeonidaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.leonidaguide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.leonidaguide.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
